name: CI

on:
  push:
  pull_request:

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - run: nix flake check

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests/*.test.sh
        run: |
          for t in tests/*.test.sh; do
            echo "==> $t"
            bash "$t"
          done
